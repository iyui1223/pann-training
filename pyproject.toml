[tool.poetry]
name = "pann-training"
version = "0.1.0"
description = "Process-Additive Neural Network (PANN): physics-partitioned SCM bias correction"
authors = ["Yuiko Ichikawa"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

numpy      = ">=1.26,<2"
torch      = ">=2.0"
PyYAML     = ">=6.0"
xarray     = ">=2024.1"
netCDF4    = "*"
matplotlib = ">=3.8"

[tool.poetry.group.dominance.dependencies]
# Optional: only needed for experiments/dominance_synthetic_test.py.
# Pulls heavy/pinned deps (bokeh==2.4.3, cufflinks, plotly, statsmodels);
# install into a throwaway env rather than the main training venv.
dominance-analysis = ">=1.1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
